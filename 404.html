<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page not found · PLAYGRID</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0e15">
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh; display: grid; place-items: center;
    background:
      radial-gradient(600px 340px at 20% 10%, rgba(139, 92, 246, 0.18), transparent 65%),
      radial-gradient(700px 380px at 80% 90%, rgba(34, 211, 238, 0.12), transparent 65%),
      #07090d;
    color: #e8eef7;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 2rem; text-align: center;
  }
  .code {
    font-size: clamp(5rem, 18vw, 9rem); font-weight: 800; letter-spacing: -0.04em; line-height: 1;
    background: linear-gradient(135deg, #8b5cf6, #6366f1 45%, #22d3ee);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
  }
  h1 { font-size: 1.4rem; margin: 0.8rem 0 0.5rem; }
  p { color: #aab6c8; max-width: 44ch; margin: 0 auto 1.8rem; }
  a.btn {
    display: inline-flex; align-items: center; gap: 0.5rem;
    background: linear-gradient(135deg, #8b5cf6, #6366f1 45%, #22d3ee);
    color: #fff; font-weight: 700; text-decoration: none;
    padding: 0.85rem 1.5rem; border-radius: 12px;
    box-shadow: 0 4px 20px rgba(99, 102, 241, 0.35);
    transition: filter 0.2s, transform 0.2s;
  }
  a.btn:hover { filter: brightness(1.12); transform: translateY(-2px); }
  kbd {
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.8rem;
    background: #151d29; border: 1px solid #2a3850; border-bottom-width: 2px;
    border-radius: 5px; padding: 1px 7px; color: #aab6c8;
  }
  .hint { margin-top: 1.6rem; font-size: 0.85rem; color: #74829a; }
</style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>This level doesn't exist</h1>
    <p>The page you're looking for was moved, deleted, or never spawned in the first place. Head back to the hub — all the verified browser games are waiting there.</p>
    <a class="btn" href="./index.html">← Back to PLAYGRID</a>
    <p class="hint">Tip: inside the portal, press <kbd>/</kbd> to search everything.</p>
  </main>
</body>
</html>
